allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  esbuild: true
  postman-code-generators: false
  protobufjs: true

minimumReleaseAge: 0

overrides:
  "@types/express-serve-static-core": 5.0.6
  webpackbar: ^7.0.0
  # Security floors for transitive dependencies flagged by Wiz on prd
  # (2026-11-16). Keeps every copy, including the docs dev-server's
  # express 4 tree, at or above the patched release.
  qs: ">=6.17.1"
  proxy-addr: ">=2.0.8"
  ip-address: ">=10.7.6"
  body-parser@1: ">=1.20.9 <2"
  body-parser@2: ">=2.4.0"
  # Security floors for dev/docs-only transitive dependencies flagged by
  # pnpm audit (2026-11-23). None ship in the API runtime (pnpm audit --prod
  # is clean). Bounded to the current major where a same-major fix exists.
  "@babel/core@7": ">=7.29.1 <8"
  baseline-browser-mapping: ">=2.11.0 <3"
  brace-expansion@1: ">=1.1.21 <2"
  browserslist: ">=4.28.7 <5"
  colord: ">=2.9.4 <3"
  compression: ">=1.8.2 <2"
  fast-uri@3: ">=3.1.9 <4"
  follow-redirects: ">=1.16.2 <2"
  git-diff: ">=2.0.7 <3"
  handlebars: ">=4.7.10 <5"
  image-size@2: ">=2.0.3 <3"
  joi@17: ">=17.13.9 <18"
  js-yaml@3: ">=3.15.2 <4"
  js-yaml@4: ">=4.3.2 <5"
  js-yaml@5: ">=5.4.1 <6"
  launch-editor: ">=2.14.2 <3"
  nanoid@3: ">=3.3.18 <4"
  postcss: ">=8.5.23 <9"
  postcss-selector-parser@6: ">=6.1.5 <7"
  postcss-selector-parser@7: ">=7.1.6 <8"
  shell-quote: ">=1.11.0 <2"
  source-map-js: ">=1.2.2 <2"
  svgo@3: ">=3.3.5 <4"
  undici@6: ">=6.29.1 <7"
  undici@7: ">=7.30.1 <8"
  websocket-driver: ">=0.7.5 <0.8"
  ws@7: ">=7.5.11 <8"
  yaml@1: ">=1.10.3 <2"
  # No same-major fix exists for these; bumped across a major and verified
  # with a full docs build.
  serialize-javascript: ">=7.1.3"
  tinypool: ">=2.1.2"
  uuid: ">=11.1.1"
  # Not overridden: @faker-js/faker 5.5.3 (GHSA helpers.fake RCE). Pinned by
  # postman-collection (latest 5.3.1 still requires 5.5.3) and faker 10 breaks
  # it. Docs-build only, fed our own OpenAPI spec, so no untrusted input.

nodeLinker: hoisted
