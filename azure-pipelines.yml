# Node.js Express Web App to Linux on Azure
# Build a Node.js Express app and deploy it to Azure as a Linux web app.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - develop

pr: none

pool:
  name: ado-vmss-latest

variables:
  # tst-scoped group (azureSubscription = SPN-dluhctst-LGOF, environmentName = tst).
  - group: postcodes-app-pipeline-vars


stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          name: ado-vmss-latest

        steps:
          - task: UseNode@1
            inputs:
              version: '24.x'
            displayName: 'Install Node.js'

          # pnpm via corepack (respects the packageManager pin in package.json).
          # nodeLinker: hoisted (set in pnpm-workspace.yaml) produces a flat,
          # symlink-free node_modules so the zip stays deployable to App Service
          # (pnpm's default layout uses symlinks into a content-addressed store,
          # which does not survive zip deploy). NB pnpm 11 ignores node-linker
          # in .npmrc — it must live in pnpm-workspace.yaml.
          - script: |
              corepack pnpm install --frozen-lockfile
              corepack pnpm run build
              corepack pnpm prune --prod
              # prune removes dev deps but leaves their node_modules/.bin
              # symlinks dangling; CopyFiles@2 errors on broken links. The .bin
              # entries are not needed at runtime (start = node dist/server.js).
              find node_modules -xtype l -delete
            displayName: 'pnpm install, build and prune'

          - task: CopyFiles@2
            displayName: 'Copy files to staging'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              Contents: |
                dist/**
                node_modules/**
                package.json
                pnpm-lock.yaml
                .deployment
              TargetFolder: '$(Build.ArtifactStagingDirectory)/package'

          - task: ArchiveFiles@2
            displayName: 'Archive files'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/package'
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              replaceExistingArchive: true

          - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            artifact: drop

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    condition: succeeded()
    jobs:
      # Plain job (not a `deployment` job) so it doesn't require an ADO
      # Environment resource. A plain job doesn't auto-download artifacts, so
      # the build output is pulled in explicitly before deploy.
      - job: Deploy
        displayName: Deploy
        pool:
          name: ado-vmss-latest
        steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure Web App Deploy: app-tst-uks-postcodes-001'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: 'app-tst-uks-postcodes-001'
              runtimeStack: 'NODE|24-lts'
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              startUpCommand: 'npm start'
